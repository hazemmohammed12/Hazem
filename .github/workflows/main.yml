name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate App and Build APK
        run: |
          flutter create hazem_app --org com.hazemtech.v2app
          cd hazem_app
          
          cat << 'EOF' > lib/main.dart
          import 'package:flutter/material.dart';

          void main() {
            runApp(const HazemTechApp());
          }

          class HazemTechApp extends StatelessWidget {
            const HazemTechApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'HazemTech Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  colorScheme: ColorScheme.fromSeed(seedColor: const Color(0xFF4F46E5)),
                  useMaterial3: true,
                ),
                home: const MainScreen(),
              );
            }
          }

          class MainScreen extends StatefulWidget {
            const MainScreen({super.key});

            @override
            State<MainScreen> createState() => _MainScreenState();
          }

          class _MainScreenState extends State<MainScreen> {
            final TextEditingController _urlController = TextEditingController();
            String _statusMessage = '';
            bool _isLoading = false;

            void _startDownload() {
              final url = _urlController.text.trim();
              if (url.isEmpty) {
                setState(() {
                  _statusMessage = 'الرجاء إدخال رابط الفيديو أولاً!';
                });
                return;
              }

              setState(() {
                _isLoading = true;
                _statusMessage = 'جاري المعالجة والتحميل...';
              });

              Future.delayed(const Duration(seconds: 2), () {
                setState(() {
                  _isLoading = false;
                  _statusMessage = 'تم تنزيل الفيديو بنجاح! 🚀';
                });
              });
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFF8FAFC),
                appBar: AppBar(
                  title: const Text('HazemTech Pro v2.0', style: TextStyle(fontWeight: FontWeight.bold)),
                  centerTitle: true,
                  backgroundColor: const Color(0xFF4F46E5),
                  foregroundColor: Colors.white,
                ),
                body: Padding(
                  padding: const EdgeInsets.all(24.0),
                  child: Column(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      const Icon(Icons.video_library_rounded, size: 80, color: Color(0xFF4F46E5)),
                      const SizedBox(height: 16),
                      const Text('تطبيق تنزيل الفيديوهات', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
                      const SizedBox(height: 32),
                      TextField(
                        controller: _urlController,
                        decoration: InputDecoration(
                          hintText: 'إلصق رابط الفيديو هنا...',
                          prefixIcon: const Icon(Icons.link),
                          border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                          filled: true,
                          fillColor: Colors.white,
                        ),
                      ),
                      const SizedBox(height: 16),
                      SizedBox(
                        width: double.infinity,
                        height: 50,
                        child: ElevatedButton(
                          onPressed: _isLoading ? null : _startDownload,
                          style: ElevatedButton.styleFrom(
                            backgroundColor: const Color(0xFF4F46E5),
                            foregroundColor: Colors.white,
                            shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                          ),
                          child: _isLoading
                              ? const CircularProgressIndicator(color: Colors.white)
                              : const Text('تحميل الفيديو', style: TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                        ),
                      ),
                      const SizedBox(height: 24),
                      Text(
                        _statusMessage,
                        style: TextStyle(
                          fontSize: 14,
                          fontWeight: FontWeight.w600,
                          color: _statusMessage.contains('بنجاح') ? Colors.green : Colors.redAccent,
                        ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          EOF

          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazemTech-Pro-APK
          path: '**/*.apk'
