name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. إنشاء هيكل مشروع Flutter كامل تلقائياً
      - name: Generate Complete Flutter Project
        run: |
          # إنشاء مشروع محلي مؤقت
          flutter create temp_app --org com.hazemtech.v2app
          
          # نقل ملفات البناء الأساسية إلى المستودع
          cp -r temp_app/android ./
          cp temp_app/pubspec.yaml ./
          mkdir -p lib
          
          # إذا كان main.dart موجـوداً يتم حفظه، وإلا يتم إنشاء الكود الأساسي
          if [ -f "main.dart" ]; then
            cp main.dart lib/main.dart
          elif [ ! -f "lib/main.dart" ]; then
            cp temp_app/lib/main.dart lib/main.dart
          fi

      # 5. تنزيل التبعيات والتجميع
      - name: Install Dependencies & Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      # 6. رفع ملف الـ APK النهائي لتنزيله
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HazemTech-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
